# How many tests that start a Chrome may run at once.
#
# **Every test still runs, and is judged exactly as before.** This decides
# only how many Chromes are alive at the same moment, never which tests run
# or what they must show, so it makes the gate no weaker.
#
# Why: on 2026-10-26 the gate failed three times in one day — at 10:01, 18:37
# and 19:07 — and every failure was a Chrome that "said nothing for 30000 ms"
# in a test the change under judgement did not touch. A Chrome started on its
# own answered in 2 s. Run eight at a time — one per core, nextest's default
# — beside an editor and a person's own Chrome, an 8 GB machine ran out of
# memory and swapped, and some Chrome missed its thirty seconds. Lengthening
# that wait would hide a slow browser behind a patient test; the wait is the
# contract. So the Chromes take turns instead.
#
# A test that starts a Chrome must be in this group: put "chrome" in its
# file's name, or add the file below by name. That includes a test that
# starts one only through the application: on 2026-10-28
# `the_application_opens_its_own_page`, in no group, ran beside
# `a_closed_list_chosen_through_a_shown_chrome`, brought its own Chrome in
# front mid-walk, and the menu chose an option nobody asked for — two runs
# of three beside it, none of three alone.
[test-groups]
chrome = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(alo-window) & (binary(~chrome) | binary(=a_window_given_less_room_than_asked) | binary(=a_tab_whose_page_closes_under_a_question) | binary(=the_application_opens_its_own_page) | binary(=the_window_on_screen_kept_and_copied) | binary(=two_alos_with_their_own_data_in_the_window) | binary(=the_conversation_window_on_the_accessibility_bus))'
test-group = 'chrome'

# A test that shows Chrome's window takes both turns, so no other Chrome
# runs beside it: one shown Chrome brought in front sends another's window
# into Stage Manager's strip (item 643), where the window server lists it
# shrunk and a capture of it is not the page. Found on 2026-10-27, when
# `the_box_marked_through_chrome` read the screen for seventeen seconds
# while another test's shown Chrome stood in front of its window.
#
# A test that shows Chrome's window is in this list by its file's name.
# So is `the_window_on_screen_kept_and_copied` (queue item 873), which shows
# windows of its own and reads them off the screen: a shown Chrome brought
# in front of them would be what it read.
[[profile.default.overrides]]
filter = 'package(alo-window) & (binary(=a_chrome_window_brought_in_front_of_another) | binary(=a_frame_beside_chromes_window) | binary(=a_page_in_chromes_own_window) | binary(=a_window_given_less_room_than_asked) | binary(=the_pages_tab_in_chromes_frame) | binary(=the_frame_around_chromes_window) | binary(=the_program_told_to_use_chrome) | binary(=the_box_marked_through_chrome) | binary(=the_application_opens_its_own_page) | binary(=a_closed_list_chosen_through_a_shown_chrome) | binary(=a_closed_list_in_a_chrome_macos_does_not_let_us_post_keys_to) | binary(=a_page_chosen_in_the_conversation_opened_in_chrome) | binary(=alos_cef_host_shows_a_page_as_chrome_does) | binary(=the_box_marked_through_alos_cef_host_as_chrome) | binary(=a_page_as_a_card_through_chrome) | binary(=a_persons_input_on_a_card_reaches_chromes_page) | binary(=the_cards_buttons_pressed_in_the_window_through_chrome) | binary(=a_search_result_opened_in_the_card_through_chrome) | binary(=a_card_whose_page_replaces_itself_through_chrome) | binary(=a_card_drawn_before_its_page_loads_through_chrome) | binary(=the_cards_back_and_forward_through_chrome) | binary(=a_cards_loading_from_a_navigations_start_through_chrome) | binary(=a_conversation_scrolled_through_chrome) | binary(=a_mailto_link_in_a_card_through_chrome) | binary(=a_cards_page_moving_its_own_window_through_chrome) | binary(=a_persons_hover_and_double_click_on_a_card_through_chrome) | binary(=a_persons_keys_on_a_card_through_chrome) | binary(=alos_cef_host_closed_under_a_context_menu_as_chrome) | binary(=a_chromiums_profile_stays_removed_as_chrome) | binary(=a_first_press_on_a_card_just_opened_through_chrome) | binary(=an_agent_reaching_a_page_the_conversation_opened_through_chrome) | binary(=a_parked_cards_own_windows_unseen_through_chrome) | binary(=the_agent_at_work_on_a_card_through_chrome) | binary(=the_agent_begins_with_no_page_through_chrome) | binary(=what_a_cards_chromium_tells_beside_its_pipe_through_chrome) | binary(=an_expanded_cards_link_shown_in_alos_strip_through_chrome) | binary(=a_closed_list_pressed_on_a_card_through_chrome) | binary(=an_agents_card_takes_its_name_as_alo_resolved_it_through_chrome) | binary(=the_window_on_screen_kept_and_copied) | binary(=sign_ins_kept_from_card_to_card_through_chrome) | binary(=a_cards_colours_in_srgb_on_every_display_through_chrome) | binary(=a_new_chat_opened_by_an_agent_outside_through_chrome) | binary(=two_alos_with_their_own_data_in_the_window) | binary(=a_second_alo_hands_its_address_to_the_first_through_chrome) | binary(=the_conversation_window_on_the_accessibility_bus) | binary(=a_cards_page_on_the_accessibility_bus_through_chrome))'
threads-required = 2
