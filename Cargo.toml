# Line tables, not the whole of DWARF.
#
# Cargo's default is `debug = true`, which writes complete debug information
# into every artefact. With 4,642 tests across nineteen crates that came to
# **73 GB** in `target/debug/deps` — against 78 GB free on this volume, which
# is a cliff rather than a cost: a little more growth and `cargo` fails
# mid-write and the build loop dies untidily.
#
# `debug = 1` keeps the line tables, so a failing test still names its file and
# line, which is the only thing this repository's loop ever reads from a
# backtrace. What it drops is the rest — variable layouts, types, the things a
# person stepping through `lldb` would want and nothing here has ever used.
#
# Measured on 2026-10-13, both halves, because the second was a guess:
#
#   target/            74 GB  ->  7.7 GB      a 9.6x reduction
#   disk free          78 GB  ->  144 GB
#   warm gate        15.0 min ->  13.5 min    -10%, one sample against a
#                                             median of twenty-one
#
# The disk was the point and it came out far better than the 50-70% expected.
# The speed was expected to be 20% or more and is 10%, which is worth having
# and is not the reason this is here. A cold build with an empty target now
# finishes in 16.5 minutes, about what a *warm* gate cost before.
[profile.dev]
debug = 1

[workspace]
resolver = "3"
members = ["crates/*"]
# alo's CEF host (queue item 725, ADR 0079 § 3 option H) is built only where
# a CEF distribution is unpacked and `CEF_PATH` names it: `cef-dll-sys`
# compiles CEF's C++ wrapper from that distribution, and with no `CEF_PATH`
# it downloads one at build time, which nothing here may do. So it is its own
# workspace, with its own lockfile pinning the `cef` crate, built and driven
# by `alo-window`'s `tests/alos_cef_host_driven_as_chrome.rs` when a
# distribution is there and skipped, saying why, when it is not.
exclude = ["crates/alo-cef-host"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/aloworld-org/alo-browser"
authors = ["the alo browser authors"]

[workspace.dependencies]
html5ever = "0.39"
# XML, rented (ADR 0027), to read an SVG file and nothing else. A pull reader,
# so the tree is ours and so is the depth bound; it hands DTDs and entity
# references back unacted on, and `alo-dom`'s `xml.rs` refuses them. Default
# features off (the set is empty; `memchr` is its one dependency), and
# `#![forbid(unsafe_code)]`. Already in the lockfile through `wayland-scanner`.
quick-xml = { version = "0.41", default-features = false }
cssparser = "0.37"
selectors = "0.40"
precomputed-hash = "0.1"
rustybuzz = "0.20"
# Font outlines, rented (ADR 0001), with `gvar-alloc` on. Without it the parser
# holds a glyph's variation tuples on the stack, thirty-two at most, and refuses
# any glyph with more: no outline at all, at any weight, the default instance
# included. This machine's own `sans-serif`, `.SF NS` (four axes), has more on
# nearly every letter, so every word drawn with it was blank (queue item 683).
# On the heap the bound is the format's own — a 12-bit count, 4095 tuples, a few
# hundred kilobytes for a hostile font's worst glyph — and the parse is
# otherwise the same. `alo-text` names the crate too, so that shaping and
# measuring with `rustybuzz`'s copy of it get the feature in every build.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
tiny-skia = "0.12"
png = "0.18"
url = "2.5"
# The public suffix list, rented (ADR 0001). It is data rather than physics —
# Mozilla's list of the names anybody may register under, which nobody can
# derive and which changes when a registry does. `psl` compiles a snapshot of it
# in, so the answer needs no network and no file: a browser that had to fetch its
# own security boundary would have one only when the fetch worked. Updating the
# list is a version bump here, in a diff somebody reads.
psl = "2.1"
encoding_rs = "0.8"
# TLS, rented (ADR 0001, and ADR 0005 names it among the physics whose `unsafe`
# is not ours to remove). `ring` rather than the default `aws-lc-rs`: both carry
# C, and `ring` is the smaller and more widely audited of the two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
rcgen = "0.13"
# Content encodings, rented (ADR 0001). All three are pure Rust on purpose: a
# decompressor is the single place in a browser where a memory bug is most
# directly a remote code execution, because the attacker chooses every byte the
# allocator sees. `flate2` on its `rust_backend` (miniz_oxide) rather than the
# C zlib it defaults to, and `ruzstd` rather than the C `zstd` bindings.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
ruzstd = "0.8"
# JPEG, rented (ADR 0001), and pure Rust for ADR 0010's reason: a decoder is
# where a memory bug is most directly a remote code execution, because the
# attacker chooses every byte the allocator sees. `jpeg-decoder` is the one
# Servo and `image` use, and it forbids `unsafe` outside an optional SIMD
# feature this does not enable.
jpeg-decoder = { version = "0.3", default-features = false }
# GIF and WebP, rented (ADR 0001), for the same reason and on the same terms:
# both pure Rust, both the crates `image` uses, and both `#![forbid(unsafe_code)]`
# throughout, as are two of the three small crates they bring (`weezl` for
# GIF's LZW, `byteorder-lite` for WebP's integers); the third, `quick-error`, is
# an error-declaring macro with no `unsafe` in it. All are MIT or Apache-2.0.
# GIF without its default features, which add an encoder's colour quantiser
# nobody here asked for. `image-webp` is not trusted on one point and is
# guarded in front of it: see `alo-paint`'s `webp_picture.rs`.
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
# A digest, rented (ADR 0001): a hash function is physics, and one somebody
# wrote themselves is the kind of code that is wrong in a way nothing notices
# until a policy allows content it should not. `sha2` is the RustCrypto one —
# pure Rust, with the CPU's own SHA instructions used through `cpufeatures`
# where there are any.
sha2 = "0.10"
# The identifier classes ECMAScript names, rented (ADR 0001, and ADR 0013 § 8
# lists Unicode tables among the physics an engine does not differ by). It is
# `unicode-id-start` rather than the more widely used `unicode-ident` because
# the two answer different questions: `unicode-ident` gives XID_Start and
# XID_Continue, and ECMAScript's grammar names **ID_Start and ID_Continue**.
# The difference is a handful of pathological code points, and taking the crate
# that answers the question asked is cheaper than writing down which ones.
unicode-id-start = "1.4"
unicode-linebreak = "0.1"
# Case mapping, rented (ADR 0049 § 2): Unicode's full upper- and lowercase
# mappings and their language tailorings (Turkish and Azeri `i`, Lithuanian's
# kept dot, Greek uppercasing without accents), which the standard library has
# the data for but not the tailorings. ICU4X, the project whose `icu_*` crates
# are already beneath `url`'s IDNA at this version; pure Rust, with its data
# compiled in, so there is no file to load. `icu_locale_core` reads the `lang`
# attribute into the identifier it takes, with `alloc` for that parser. Both
# named in one file, `alo-box`'s `case.rs`.
icu_casemap = "2.1"
icu_locale_core = { version = "2.1", features = ["alloc"] }
unicode-script = "0.5"
# Which characters are meant to be shown as emoji (ADR 0088): Unicode's
# `Emoji`, `Emoji_Presentation` and `Emoji_Component` (UTS #51), the same
# crate and version `rustybuzz` already carries, named in one file,
# `alo-text`'s `emoji.rs`.
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
dejavu = "2.37"
# The window, rented (ADR 0024 § 1). `winit` is the window and its events and
# `softbuffer` puts CPU-drawn pixels in it; both reach the window server through
# `unsafe` of their own (on macOS, the `objc2` crates), which is ADR 0010's
# "the crate's, not ours" — every function this repository calls on them is a
# safe one, checked in their source by the commit that added them. Each is
# named in one file of `alo-window`. `winit` 0.31 is in beta and not taken.
winit = "0.30.13"
softbuffer = "0.4.8"
# The two traits `softbuffer` bounds a window by, named in `present.rs` so that
# `winit` stays in `window.rs`. Already beneath both crates at this version.
raw-window-handle = "0.6"
# How much of a disk is free, rented (ADR 0025 § 3, queue item 306). The
# standard library has no call for it and law 4 forbids writing one, so this is
# `rustix`'s `statvfs`: a safe function whose `unsafe` is the crate's, not ours
# (ADR 0010) — over the C library on macOS and the kernel's own call on Linux.
# Only `fs`, and `std` for `Path`. Already beneath `winit` and `softbuffer` on
# Linux at this version, and named in one file of `alo-storage`.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
# JSON, rented (ADR 0055 § 3), to read what an agent outside this browser asks
# and to write what it is answered — and nothing else. An interface outsiders
# build against has to be writable in any language in an afternoon, and a JSON
# reader is physics nobody's engine differs by. Without default features but
# `std`, so its map is ordered by key and an answer is the same bytes each time.
# Named in one file, `alo-window`'s `protocol.rs`, with every bound in front of
# it ours.
serde_json = { version = "1", default-features = false, features = ["std"] }
# `detailed_layout_info` for where a grid's tracks ended up, which a scroll
# container pads (queue item 694) and no box's geometry holds.
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }

# Law 4 of CLAUDE.md, enforced by the compiler rather than by review: `unsafe`
# is forbidden outside a reviewed, named boundary with an ADR. A crate that ever
# earns such a boundary relaxes this in its own manifest, and the ADR says why.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# The gate in CLAUDE.md asks for zero clippy warnings and zero errors. These go
# past it deliberately: `pedantic` because the cost of reading a warning is far
# below the cost of a wrong pixel, and the panic family because a rendering
# engine that aborts the shell it draws is worse than one that reports an error.
# `clippy.toml` permits all of the panic family inside tests, which is exactly
# where the gate permits them.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
# Style only, and both fire on names this repository chose on purpose.
must_use_candidate = "allow"
module_name_repetitions = "allow"
