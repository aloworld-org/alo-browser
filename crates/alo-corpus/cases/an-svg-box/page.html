<!-- The offline screen's own <svg>, as alo-workplace/web/public/offline.html
     writes it: a 56px square from the stylesheet and aria-hidden, so the
     agent does not read it. Its four paths are shapes, not boxes (ADR 0022). -->
<main>
  <svg class=hand viewBox="0 0 24 24" fill="none" stroke="#e76f51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
    <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
    <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
  </svg>
</main>
<!-- Sized only by its attributes, and named by its <title>. -->
<p><svg class=attributes width="48" height="24"><title>Attributes</title><rect width="48" height="24" /></svg></p>
<!-- One attribute and a viewBox: the other side follows from the ratio. -->
<p><svg class=half width="80" viewBox="0 0 2 1" aria-label="Half"></svg></p>
<!-- Only a viewBox: as wide as the paragraph, and as tall as its shape. -->
<p id=ratio-name>Ratio<svg class=ratio viewBox="0 0 4 1" aria-labelledby="ratio-name"></svg></p>
<!-- Nothing at all: CSS's default object size, 300 by 150, unnamed. -->
<p><svg class=nothing></svg></p>
