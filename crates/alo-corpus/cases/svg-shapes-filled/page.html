<!-- Queue item 271: every basic shape, filled, inside <svg> boxes laid out
     as pictures (ADR 0022). Each <svg> has a pale background so its box and
     the viewport the shapes are drawn into can both be seen. -->
<p class=row>
  <!-- Each shape in a 20-unit viewBox drawn at 40 px, so everything doubles. -->
  <svg viewBox="0 0 20 20" aria-label="Rect"><rect x="2" y="4" width="16" height="12" fill="#e76f51"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Rounded rect"><rect x="2" y="2" width="16" height="16" rx="5" fill="#2a9d8f"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Circle"><circle cx="10" cy="10" r="8" fill="#264653"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Ellipse"><ellipse cx="10" cy="10" rx="9" ry="5" fill="#e9c46a"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Polygon"><polygon points="10,1 19,19 1,19" fill="#8ab17d"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Polyline"><polyline points="1,1 19,1 1,19" fill="#f4a261"/></svg>
</p>
<!-- The same five-pointed star, one outline crossing itself: non-zero fills
     its middle, even-odd leaves a hole there. -->
<p class=row>
  <svg viewBox="0 0 20 20" aria-label="Non-zero"><polygon points="10,1 15.3,18.1 1.4,7.5 18.6,7.5 4.7,18.1" fill="#264653"/></svg>
  <svg viewBox="0 0 20 20" aria-label="Even-odd"><polygon points="10,1 15.3,18.1 1.4,7.5 18.6,7.5 4.7,18.1" fill="#264653" fill-rule="evenodd"/></svg>
  <!-- A group faded once: where its two squares overlap is no darker. -->
  <svg viewBox="0 0 20 20" aria-label="Group"><g opacity="0.5" fill="#e76f51"><rect x="1" y="1" width="12" height="12"/><rect x="7" y="7" width="12" height="12"/></g></svg>
  <!-- A shape's own fill-opacity: the overlap is darker. -->
  <svg viewBox="0 0 20 20" aria-label="Fill opacity"><rect x="1" y="1" width="12" height="12" fill="#e76f51" fill-opacity="0.5"/><rect x="7" y="7" width="12" height="12" fill="#e76f51" fill-opacity="0.5"/></svg>
  <!-- transform: a square turned about its own middle. -->
  <svg viewBox="0 0 20 20" aria-label="Turned"><rect x="5" y="5" width="10" height="10" fill="#2a9d8f" transform="rotate(45 10 10)"/></svg>
  <!-- A presentation attribute says red; the stylesheet says otherwise and wins. -->
  <svg viewBox="0 0 20 20" aria-label="Overridden"><rect class=overridden x="2" y="2" width="16" height="16" fill="red"/></svg>
</p>
<!-- currentColor: the icon is the colour of the text it sits in. -->
<p class=warm>Warm <svg class=icon viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg></p>
<p class=cool>Cool <svg class=icon viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg></p>
<!-- preserveAspectRatio: a square viewBox in a wide box, met in the middle,
     met at the start, sliced, and stretched. The last runs past its box and
     is cut at its edge. -->
<p class=row>
  <svg class=wide viewBox="0 0 10 10" aria-label="Meet"><circle cx="5" cy="5" r="5" fill="#264653"/></svg>
  <svg class=wide viewBox="0 0 10 10" preserveAspectRatio="xMinYMid meet" aria-label="Start"><circle cx="5" cy="5" r="5" fill="#264653"/></svg>
  <svg class=wide viewBox="0 0 10 10" preserveAspectRatio="xMidYMid slice" aria-label="Slice"><circle cx="5" cy="5" r="5" fill="#264653"/></svg>
  <svg class=wide viewBox="0 0 10 10" preserveAspectRatio="none" aria-label="Stretch"><circle cx="5" cy="5" r="5" fill="#264653"/></svg>
</p>
