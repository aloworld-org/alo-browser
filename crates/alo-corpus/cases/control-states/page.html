<!DOCTYPE html>
<html><body>
<div class=row><input type=checkbox id=off><label for=off>Off</label></div>
<div class=row><input type=checkbox id=on checked><label for=on>On</label></div>
<div class=row><input type=checkbox id=some aria-checked=mixed><label for=some>Some</label></div>
<div class=row><input type=checkbox id=locked-on checked disabled><label for=locked-on>On, locked</label></div>
<div class=row><input type=checkbox id=locked-off disabled><label for=locked-off>Off, locked</label></div>
<div class=row><input type=radio name=size id=small><label for=small>Small</label></div>
<div class=row><input type=radio name=size id=medium checked><label for=medium>Medium</label></div>
<div class=row><input type=radio name=size id=large checked disabled><label for=large>Large, locked</label></div>
<div class="row accented"><input type=checkbox id=theirs checked><label for=theirs>Their colour</label></div>
</body></html>
