<!doctype html>
<!-- The frame's band (queue item 991, ADR 0024 § 4). Compiled into the
     renderer and never assembled from anything: `band_document.rs` puts the
     page's title into #band as a text node with alo-dom's operations, and
     the application's name after it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Window</title>
  </head>
  <body>
    <div id="band" class="band" role="banner"></div>
  </body>
</html>
