<!doctype html>
<!-- The chats panel's template (ADR 0074). Compiled into the renderer and
     never assembled from anything: `panel_document.rs` puts each group and
     each chat into #chats with alo-dom's operations, and a chat's name and
     site in as text nodes. Its two icons are drawn here, by our own fixed
     markup, hidden from an agent and in the colour of the words beside
     them. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chats</title>
  </head>
  <body>
    <nav class="panel" aria-label="Chats">
      <div class="head"><span class="mark" aria-hidden="true">alo</span></div>
      <a class="new" href="#new-chat"><svg class="icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3 8h10" /></svg>New chat<span class="keys" aria-hidden="true">⌘T</span></a>
      <div id="chats" class="groups"></div>
      <div class="foot">
        <a class="settings" href="#settings"><svg class="icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6M12 5h2M2 11h2M8 11h6" /><circle cx="10" cy="5" r="2" /><circle cx="6" cy="11" r="2" /></svg>Settings</a>
      </div>
    </nav>
  </body>
</html>
